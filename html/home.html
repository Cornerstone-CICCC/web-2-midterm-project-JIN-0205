<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="/css/home.css">
</head>
<body>
  <header>
    <div class="hamburger-box">
      <div class="hum-btn">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="header-logo">
        <a href="home.html"><img src="/images/logo.svg" alt="main-logo"></a>
      </div>
      <ul class="header-list">
        <li><a href="home.html" class="header-list-a">Home</a></li>
        <li><a href="about.html" class="header-list-a">About Us</a></li>
        <li><a href="#" class="header-list-a">Sign Up</a></li>
        <li><div class="theme-btn"></div></li>
      </ul>
    </div>
  </header>

  <div class="space-holder"></div>
  <main>

    <section class="search-results">
      <div class="search-box">
        <form name="search" autocomplete="off">
          <input type="text" id="search-box" class="input" name="txt"  onmouseout="this.value = ''; this.blur();">
        </form>
        <i class="fas fa-search"><img src="/images/search.svg" alt=""></i>
      </div>
      <div class="search-lists">
        <div class="section-title">
          <h3>Search Results</h3>
        </div>

        <div class="container">
          <ul id="search-results"></ul>
        </div>
      </div>
    </section>

    <section class="trending-movies">
      <div class="section-title">
        <h3>Trending Movies</h3>
      </div>

      <div class="container">
        <ul id="trending-movie-list"></ul>
      </div>
    </section>

    <section class="upcoming-movies">
      <h3 class="section-title">Upcoming Movies</h3>
      <div class="container">
        <ul id="upcoming-movie-list"></ul>
      </div>
    </section>
    <section class="upcomimg-movies"></section>
    <div class="test"></div>
  </main>
  <footer>
    <p class="copyright">&copy;2024 All Rights Reserved.</p>
  </footer>
  <script src="/js/app.js"></script>
</body>
</html>
